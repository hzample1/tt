name: OpenWorld 免费 VPS 库存监控

on:
  workflow_dispatch:
  schedule:
    # 每 5 分钟触发一次，配合脚本内部 4.5 分钟循环（每 15 秒一次），实现 24 小时无缝轮询
    - cron: '*/5 * * * *'

concurrency:
  group: openworld-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: 15秒高频监控
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up WARP
        uses: fscarmen/warp-on-actions@v1.1

      - name: 执行监控脚本
        env:
          OPENWORLD_COOKIE: ${{ secrets.OPENWORLD_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
        run: |
          python main.py

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 1
          keep_minimum_runs: 3
