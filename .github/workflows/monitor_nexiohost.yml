name: NexioHost Free Bot 库存监控

on:
  workflow_dispatch: # 手动一键触发单次诊断测试
  # 验证通过后取消下方注释即可开启每小时无缝监控:
  # schedule:
  #   - cron: '0 * * * *'

concurrency:
  group: nexiohost-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: SeleniumBase UC 自动过盾监控
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖与 Python 库
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb jq
          python -m pip install --upgrade pip
          pip install seleniumbase requests beautifulsoup4 pyvirtualdisplay

      - name: 设置代理
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x setup_proxy.sh
          if ! bash setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="❌ NexioHost 监控失败：代理不可用" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行监控脚本
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_ONCE: "true" # 开启单次诊断模式，输出控制台日志后退出
          LOOP_INTERVAL: "20"
          MAX_RUN_SECONDS: "3540"
          PROXY_SERVER: ${{ env.PROXY_SERVER }}    # 由 setup_proxy.sh 写入
        run: |
          python monitor_nexiohost.py

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 1
          keep_minimum_runs: 3
